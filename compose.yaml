services:
  api:
    image: docker.io/kavarkon/templebar-api:35245f0
    restart: unless-stopped
    env_file:
      - /etc/templebar/api.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/lib/templebar/posters:/data/posters
    extra_hosts:
      - "host.docker.internal=172.30.0.1"
    networks:
      - templebar
networks:
  templebar:
    name: templebar-network
    external: true

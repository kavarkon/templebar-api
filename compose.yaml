services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: templebar-api:latest

    restart: unless-stopped

    env_file:
      - /etc/templebar/api.env

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - /var/lib/templebar/posters:/data/posters

    extra_hosts:
      - "host.docker.internal=host-gateway"

    networks:
      - templebar

networks:
  templebar:
    name: templebar-network

    driver: bridge

    ipam:
      config:
        - subnet: 172.30.0.0/24

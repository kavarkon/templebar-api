spring:
  datasource:
    url: ${DATABASE_URL}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

storage:
  upload-directory: ${STORAGE_UPLOAD_DIRECTORY:uploads}

  cleanup:
    orphan-max-age: ${STORAGE_ORPHAN_MAX_AGE:24h}
    interval: ${STORAGE_CLEANUP_INTERVAL:1h}

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000

jwt:
  secret: ${JWT_SECRET}

cookie:
  secure: false

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
